# Cloudflare Pages project config.
# The presence of `pages_build_output_dir` tells Cloudflare/Wrangler this is a
# PAGES project (static assets in ./public + Functions in ./functions) — NOT a Worker.
name = "the-pink-spa-bus"
pages_build_output_dir = "./public"
compatibility_date = "2024-11-01"
[[d1_databases]]
binding = "DB"
database_name = "tps-disclosures"
database_id = "1d0e183d-3968-41e6-9209-a1be03f3e401"
